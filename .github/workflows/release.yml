name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Tests run here, with a read-only token: code they execute (dependencies included)
  # never sees the permissions that sign and publish the release.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only what reached main, through a pull request and its required checks, is
      # released: a tag on any other commit stops here.
      - name: Tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - name: go test
        run: go test ./...

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the checksums and the provenance attestation
      attestations: write
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # The steps below also run when a later GoReleaser step (the cask) fails: the
      # release assets are already public by then.
      - name: Attest build provenance
        if: ${{ !cancelled() && hashFiles('dist/checksums.txt') != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
      - id: hashes
        name: Hashes for the SLSA provenance
        if: ${{ !cancelled() && hashFiles('dist/checksums.txt') != '' }}
        run: echo "hashes=$(base64 -w0 < dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  # SLSA level 3 provenance, attached to the release as hop.intoto.jsonl. The generator
  # must be referenced by tag: it checks its own ref when it runs.
  provenance:
    needs: goreleaser
    if: ${{ !cancelled() && needs.goreleaser.outputs.hashes != '' }}
    permissions:
      actions: read # read the workflow run
      id-token: write # sign the provenance
      contents: write # upload it to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.goreleaser.outputs.hashes }}
      provenance-name: hop.intoto.jsonl
      upload-assets: true
